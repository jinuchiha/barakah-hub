name: Drain notification outbox

# The outbox is the ONLY thing that delivers queued WhatsApp and email:
# `enqueue` writes a row and nothing sends inline. So this schedule is the
# delivery mechanism itself, not a retry safety net — if it stops, members
# stop getting payment receipts and approval notices.
#
# It lives here rather than in vercel.json because Vercel's Hobby plan
# refuses any cron expression that runs more than once a day. That refusal
# is silent at the deployment level: while `*/5 * * * *` sat in
# vercel.json, every push to main was rejected without even creating a
# failed deployment row, so the site quietly served three-day-old code.
# A once-daily drain was the other option and is worse — a member would
# wait up to 24 hours for the receipt of a payment they just made.
#
# GitHub's scheduler is best-effort and runs late under load, sometimes by
# 10-20 minutes. OUTBOX_HEARTBEAT_STALE_MINUTES in app/api/health/route.ts
# is set wide enough to absorb that; tighten one and you must tighten the
# other, or /api/health?deep=1 will report a degradation that is really
# just GitHub being GitHub.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# A drain that is still working must not have a second one stacked on top
# of it. The route is idempotent per message, but overlapping runs waste
# provider quota re-checking the same rows.
concurrency:
  group: outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    name: POST /api/cron/outbox
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fail loudly and immediately rather than sending an unauthenticated
      # request: the endpoint answers 401 when the bearer does not match,
      # which curl would report as a plain HTTP error and nobody would
      # connect to a missing repository secret.
      - name: Require the shared secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions, matching the" \
                 "CRON_SECRET in the Vercel Production environment. Until then" \
                 "nothing is delivered."
            exit 1
          fi

      - name: Drain the queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Override with an APP_URL repository variable if the domain moves.
          APP_URL: ${{ vars.APP_URL || 'https://barakah-hub.vercel.app' }}
        run: |
          # The route declares maxDuration = 300, so allow a genuinely long
          # drain to finish instead of cutting it off and leaving messages
          # half-processed.
          #
          # -f so a 401 or 500 turns the job red. A silent failure here is
          # indistinguishable from "there was nothing to send".
          curl -fsS --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/outbox"
          echo
