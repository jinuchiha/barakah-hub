name: DB maintenance

# Manually dispatched admin tool. Uses the same NEON_API_KEY /
# NEON_PROJECT_ID secrets as the PR-branch workflow. Tasks:
#   branches     — list the project's Neon branches (find where prod lives)
#   migrate      — run pending migrations against the chosen branch
#   verify       — check the latest migration's columns + member count
#   e2e-*        — manage the throwaway @barakah-test.dev E2E account
on:
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        required: true
        type: choice
        options: [branches, migrate, verify, e2e-approve, e2e-promote, e2e-cleanup]
      email:
        description: e2e test account email (@barakah-test.dev only)
        required: false
        default: ''
      branch:
        description: Neon branch name to target
        required: false
        default: main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List branches
        if: inputs.task == 'branches'
        run: |
          curl -sf "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            | jq -r '.branches[] | [.name, "default=\(.default)", "created=\(.created_at)"] | @tsv'

      - name: Fetch connection string
        if: inputs.task != 'branches'
        id: conn
        run: |
          uri=$(curl -sf "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/connection_uri?branch_name=${{ inputs.branch }}&database_name=neondb&role_name=neondb_owner" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" | jq -r .uri)
          if [ -z "$uri" ] || [ "$uri" = "null" ]; then echo "no uri for branch ${{ inputs.branch }}" >&2; exit 1; fi
          echo "::add-mask::$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: inputs.task != 'branches'
        uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }

      - name: Setup Node
        if: inputs.task != 'branches'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next-app/pnpm-lock.yaml

      - name: Install
        if: inputs.task != 'branches'
        working-directory: next-app
        run: pnpm install --frozen-lockfile

      - name: Run task
        if: inputs.task != 'branches'
        working-directory: next-app
        env:
          DATABASE_URL_DIRECT: ${{ steps.conn.outputs.uri }}
          TASK: ${{ inputs.task }}
          E2E_EMAIL: ${{ inputs.email }}
        run: |
          if [ "$TASK" = "migrate" ]; then
            pnpm db:migrate
          else
            pnpm exec tsx scripts/db-maintenance.ts "$TASK" "$E2E_EMAIL"
          fi
